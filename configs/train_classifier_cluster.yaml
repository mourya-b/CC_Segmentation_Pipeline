data:
  sources:
    - base_dir: "/data/diag/mouryaBandaru/data/PECTUS_segmentations"
      dicom_dir: "/data/diag/rubenvdw/Dataset/DICOMS_Pectus"
    - base_dir: "/data/diag/mouryaBandaru/data/ORANGE_segmentations"
      dicom_dir: "/data/diag/rubenvdw/Dataset/ORANGE_Dicoms"
  annotation_excel: "/data/diag/mouryaBandaru/data/CC_Annotations_v3.xlsx"
  image_size: 512

model:
  backbone: "efficientnet_b0"
  num_classes: 2
  pretrained: true

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  val_split: 0.2
  seed: 42
  weight_decay: 0.0001
  early_stopping_patience: 10
  val_patients:
    - "NLD-RADB-0060"
    - "NLD-AZN-0009"
    - "NLD-AZN-0014"
    - "NL-RUMC-00033-1-1"
    - "NLD-ISALA-0012"
    - "ABW-ARU-0013"
  freeze_epochs: 10
  unfreeze_blocks: 3
  backbone_lr_scale: 0.1

loss:
  type: "focal"
  gamma: 2.0
  alpha: 0.75

output_dir: "/data/diag/mouryaBandaru/experiments/classifier_v5"